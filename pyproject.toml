[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jis-terminal"
version = "0.1.0"
description = "Local, resource-bounded suggestion engine for zsh"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jis = "jis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
